{% extends "base.html" %}

{% block title %}Create Post{% endblock %}

{% block content %}
<div class="card">
    <h2>Create New Post</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/posts/create">
        <div class="form-group">
            <label>What's on your mind?</label>
            <textarea name="post_text" required placeholder="Share your thoughts..."></textarea>
        </div>

        <div class="form-group">
            <label>Image URL (optional)</label>
            <input type="url" name="post_image" placeholder="https://...">
        </div>

        <button type="submit" class="btn btn-primary">Post</button>
        <a href="/feed" class="btn btn-danger" style="margin-left: 8px;">Cancel</a>
    </form>
</div>
{% endblock %}
